[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-market-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=2.0,<3"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
